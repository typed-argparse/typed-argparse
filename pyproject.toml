exclude-newer = "7 days"

[project]
name = "typed-argparse"
description = "Write type-safe and elegant CLIs with a clear separation of concerns."
readme = "README.md"
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = "Fabian Keller" }]
requires-python = ">=3.8"
keywords = ["types"]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dynamic = ['version']
dependencies = ["typing-extensions"]

[project.urls]
Homepage = "https://typed-argparse.github.io/typed-argparse/"
Source = "https://github.com/typed-argparse/typed-argparse"

[build-system]
requires = ['hatchling==1.27.0']  # last version to support python 3.8
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ["typed_argparse"]

[tool.hatch.build.targets.sdist]
exclude = ["/examples"]

[tool.hatch.version]
path = 'typed_argparse/__init__.py'

[dependency-groups]
dev = [
  "black<23",
  "flake8>=5.0.4",
  "mypy~=1.13.0",
  "pytest>=8.3.5",
  "pytest-cov>=5.0.0",
  "pyyaml>=6.0.3",
  "types-pyyaml>=6.0.12.20241230",
]
docs = [
    "mkdocs-material>=9.7.7",
]
extra = [
    "yachalk",
]

[tool.pytest.ini_options]
addopts = [
  "--cov=typed_argparse",
  "--cov-report", "term-missing",
  "--cov-report", "html:.cov_html",
  "--cov-report=xml",
]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
